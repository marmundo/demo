spring.application.name=demo

# --- Banco de dados H2 em memória: os dados somem quando a aplicação é encerrada ---
spring.datasource.url=jdbc:h2:mem:tarefasdb
spring.datasource.username=sa
spring.datasource.password=

# "update": o Hibernate cria/ajusta as tabelas automaticamente a partir das @Entity
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL gerado pelo Hibernate (ótimo para aprender o que o JPA faz por baixo)
spring.jpa.show-sql=true
# Formata o SQL em várias linhas para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# Habilita o console web do H2, acessível em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Token JWT ---
# Sem a variável de ambiente JWT_SECRET, usa um segredo aleatório (os tokens perdem a validade ao reiniciar)
api.security.token.secret=${JWT_SECRET:${random.uuid}}
api.security.token.expiracao-horas=2

# --- Administrador inicial ---
# Criado na inicialização somente se as variáveis de ambiente ADMIN_EMAIL e ADMIN_SENHA estiverem definidas
api.security.admin.email=${ADMIN_EMAIL:}
api.security.admin.senha=${ADMIN_SENHA:}
