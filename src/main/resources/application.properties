spring.application.name=demo

# --- Banco de dados H2 em memória: os dados somem quando a aplicação é encerrada ---
spring.datasource.url=jdbc:h2:mem:tarefasdb
spring.datasource.username=sa
spring.datasource.password=

# "update": o Hibernate cria/ajusta as tabelas automaticamente a partir das @Entity
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL gerado pelo Hibernate (ótimo para aprender o que o JPA faz por baixo)
spring.jpa.show-sql=true
# Formata o SQL em várias linhas para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# Habilita o console web do H2, acessível em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console   

# Por padrão o data.sql roda ANTES do Hibernate criar as tabelas (e falharia).
# Com esta opção ele só roda depois, inserindo as prioridades BAIXA, MEDIA e ALTA.
# Executa o data.sql somente depois que o Hibernate criou as tabelas
spring.jpa.defer-datasource-initialization=true
